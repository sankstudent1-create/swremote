services:
  - type: web
    name: swremote-relay
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
  - type: web
    name: swtranscode
    runtime: node
    rootDir: transcode
    buildCommand: npm install && curl -sL -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz && tar -xf ffmpeg.tar.xz && cp $(find . -maxdepth 2 -name ffmpeg -type f | head -1) ./ffmpeg && chmod +x ./ffmpeg && rm -rf ffmpeg.tar.xz ffmpeg-*-amd64-static && ./ffmpeg -version | head -1
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
