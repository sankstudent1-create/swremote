services:
  - type: web
    name: swremote-relay
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
  - type: web
    name: swtranscode
    runtime: node
    rootDir: transcode
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
